<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squad Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
      background: #0d1117; color: #c9d1d9; padding: 16px;
      font-size: 13px; line-height: 1.5;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; margin-bottom: 16px;
    }
    .header h1 { font-size: 15px; font-weight: 600; color: #e6edf3; }
    .header .status { display: flex; gap: 16px; font-size: 12px; color: #8b949e; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .dot.green { background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
    .dot.yellow { background: #d29922; }
    .dot.red { background: #f85149; }

    .panels { display: grid; grid-template-columns: 340px 1fr; gap: 16px; height: calc(100vh - 100px); }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .panel-header {
      padding: 10px 16px; background: #1c2128; font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.8px; color: #8b949e;
      border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center;
    }
    .panel-body { padding: 8px; overflow-y: auto; flex: 1; }

    .agent-card {
      padding: 12px; margin: 6px 0; background: #0d1117; border-radius: 6px;
      border: 1px solid #30363d; border-left: 3px solid #30363d; transition: border-color 0.2s;
    }
    .agent-card.active { border-left-color: #3fb950; }
    .agent-card .top-row { display: flex; justify-content: space-between; align-items: center; }
    .agent-card .name { font-weight: 600; color: #58a6ff; font-size: 14px; }
    .agent-card .role { font-size: 11px; color: #8b949e; margin-top: 2px; }
    .agent-card .session-id { font-size: 10px; color: #484f58; margin-top: 4px; font-family: monospace; }
    .agent-card .timing { font-size: 10px; color: #484f58; margin-top: 2px; }
    .agent-card .actions { margin-top: 8px; display: flex; gap: 6px; }

    .btn {
      padding: 3px 10px; border-radius: 4px; border: 1px solid #30363d;
      background: #21262d; color: #c9d1d9; font-size: 11px; cursor: pointer;
      font-family: inherit; transition: background 0.15s;
    }
    .btn:hover { background: #30363d; }
    .btn.danger { border-color: #f8514966; color: #f85149; }
    .btn.danger:hover { background: #f8514922; }
    .btn.primary { border-color: #58a6ff66; color: #58a6ff; }
    .btn.primary:hover { background: #58a6ff22; }

    .dispatch-bar {
      display: flex; gap: 6px; padding: 8px; border-top: 1px solid #30363d; background: #1c2128;
    }
    .dispatch-bar input {
      padding: 6px 8px; border-radius: 4px; border: 1px solid #30363d;
      background: #0d1117; color: #c9d1d9; font-family: inherit; font-size: 12px;
    }
    .dispatch-bar input:first-child { width: 100px; }
    .dispatch-bar input:nth-child(2) { flex: 1; }
    .dispatch-bar input::placeholder { color: #484f58; }

    .event { padding: 6px 10px; margin: 2px 0; font-size: 12px; border-radius: 4px; border-left: 2px solid transparent; }
    .event:hover { background: #1c2128; }
    .event .time { color: #484f58; margin-right: 8px; font-size: 11px; }
    .event .agent { color: #58a6ff; font-weight: 600; }
    .event .summary { color: #8b949e; }
    .event.created { border-left-color: #3fb950; }
    .event.destroyed { border-left-color: #484f58; }
    .event.error { border-left-color: #f85149; }
    .event.error .summary { color: #f85149; }
    .event.message { border-left-color: #58a6ff; }

    .empty { color: #484f58; text-align: center; padding: 32px 16px; }

    @media (max-width: 768px) { .panels { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>Squad Dashboard</h1>
    <div class="status">
      <span><span class="dot" id="statusDot"></span><span id="statusText">Connecting...</span></span>
      <span>Agents: <strong id="sessionCount">0</strong></span>
      <span>Events: <strong id="eventCount">0</strong></span>
      <span style="font-size:11px;color:#484f58" id="uptime"></span>
    </div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <span>Active Agents</span>
        <span id="agentCount" style="color:#3fb950"></span>
      </div>
      <div class="panel-body" id="agentList">
        <div class="empty">No active agents</div>
      </div>
      <div class="dispatch-bar">
        <input type="text" id="dispatchAgent" placeholder="agent name">
        <input type="text" id="dispatchMsg" placeholder="task message" onkeydown="if(event.key==='Enter')doDispatch()">
        <button class="btn primary" onclick="doDispatch()">Send</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <span>Event Stream</span>
        <button class="btn" onclick="events=[];seenKeys.clear();renderEvents()" style="font-size:10px">Clear</button>
      </div>
      <div class="panel-body" id="eventStream">
        <div class="empty">Waiting for events</div>
      </div>
    </div>
  </div>

  <script>
    let agents = [];
    let events = [];
    let seenKeys = new Set();
    const $ = id => document.getElementById(id);

    function timeAgo(ts) {
      if (!ts) return '';
      const s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      return Math.floor(s / 3600) + 'h ago';
    }

    function fmtUptime(s) {
      if (!s) return '';
      if (s < 60) return s + 's';
      if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
      return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    }

    function roleTag(role) {
      if (!role) return '';
      const r = role.toLowerCase();
      if (/lead|orchestrat/.test(r)) return '<span style="color:#d2a8ff">[lead]</span>';
      if (/ui|front|react/.test(r)) return '<span style="color:#7ee787">[ui]</span>';
      if (/core|back|api|service/.test(r)) return '<span style="color:#ffa657">[core]</span>';
      if (/test|qa|e2e/.test(r)) return '<span style="color:#79c0ff">[test]</span>';
      if (/review|standard/.test(r)) return '<span style="color:#f778ba">[review]</span>';
      return '';
    }

    function renderAgents() {
      const el = $('agentList');
      $('agentCount').textContent = agents.length ? agents.length : '';
      if (!agents.length) { el.innerHTML = '<div class="empty">No active agents</div>'; return; }
      el.innerHTML = agents.map(a => {
        const role = a.charterRole || a.role || 'agent';
        const sid = (a.sessionId || '').slice(0, 8);
        return `<div class="agent-card active">
          <div class="top-row">
            <span class="name">${a.agentName}</span>
            <span style="font-size:10px;color:#3fb950">active</span>
          </div>
          <div class="role">${roleTag(role)} ${role}</div>
          <div class="session-id">session: ${sid}...</div>
          <div class="timing">created ${timeAgo(a.createdAt)} | active ${timeAgo(a.lastActiveAt)}</div>
          <div class="actions">
            <button class="btn danger" onclick="doClose('${a.agentName}')">Close</button>
          </div>
        </div>`;
      }).join('');
    }

    function renderEvents() {
      const el = $('eventStream');
      $('eventCount').textContent = events.length;
      if (!events.length) { el.innerHTML = '<div class="empty">Waiting for events</div>'; return; }
      const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
      el.innerHTML = events.slice(-300).map(e => {
        const time = e.timestamp ? e.timestamp.slice(11, 19) : '';
        const agent = e.agentName ? `<span class="agent">[${e.agentName}]</span> ` : '';
        const t = (e.type || '').toLowerCase();
        const cls = t.includes('created') ? 'created'
          : t.includes('destroyed') || t.includes('closed') ? 'destroyed'
          : t.includes('error') ? 'error'
          : t.includes('message') || t.includes('dispatch') ? 'message' : '';
        return `<div class="event ${cls}"><span class="time">${time}</span>${agent}<span class="summary">${e.summary || e.type || ''}</span></div>`;
      }).join('');
      if (atBottom) el.scrollTop = el.scrollHeight;
    }

    function setStatus(state, uptime) {
      $('statusDot').className = 'dot ' + (state === 'connected' ? 'green' : state === 'error' ? 'red' : 'yellow');
      $('statusText').textContent = state === 'connected' ? ' Connected' : state === 'error' ? ' Disconnected' : ' Connecting...';
      if (uptime) $('uptime').textContent = 'up ' + fmtUptime(uptime);
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        if (res.ok) {
          const data = await res.json();
          setStatus(data.running || data.started ? 'connected' : 'error', data.uptime);
          if (data.agents) { agents = data.agents; renderAgents(); }
          if (data.activeSessions !== undefined) $('sessionCount').textContent = data.activeSessions;
          if (data.recentEvents) {
            for (const e of data.recentEvents) {
              const key = (e.timestamp || '') + (e.type || '') + (e.agentName || '');
              if (!seenKeys.has(key)) { seenKeys.add(key); events.push(e); }
            }
            renderEvents();
          }
        } else { setStatus('error'); }
      } catch { setStatus('error'); }
    }

    async function doDispatch() {
      const name = $('dispatchAgent').value.trim();
      const msg = $('dispatchMsg').value.trim();
      if (!name || !msg) return;
      try {
        const res = await fetch('/api/dispatch', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentName: name, message: msg }),
        });
        if (res.ok) { $('dispatchMsg').value = ''; setTimeout(pollStatus, 500); }
        else { const d = await res.json(); alert('Failed: ' + (d.error || 'unknown')); }
      } catch (err) { alert('Failed: ' + err.message); }
    }

    async function doClose(name) {
      try {
        await fetch('/api/close', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agentName: name }),
        });
        setTimeout(pollStatus, 500);
      } catch {}
    }

    setInterval(pollStatus, 2000);
    pollStatus();
  </script>
</body>
</html>
