<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squad Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; background: #0d1117; color: #c9d1d9; font-size: 13px; line-height: 1.5; height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
    .header h1 { font-size: 14px; font-weight: 600; color: #e6edf3; }
    .header .status { display: flex; gap: 14px; font-size: 12px; color: #8b949e; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .dot.green { background: #3fb950; box-shadow: 0 0 6px #3fb95066; }
    .dot.yellow { background: #d29922; }
    .dot.red { background: #f85149; }
    .main { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 280px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #8b949e; border-bottom: 1px solid #30363d; background: #1c2128; }
    .sidebar-body { flex: 1; overflow-y: auto; padding: 4px; }
    .agent-item { padding: 10px; margin: 3px 0; background: #0d1117; border-radius: 6px; border: 1px solid transparent; border-left: 3px solid #3fb950; cursor: pointer; transition: all 0.15s; }
    .agent-item:hover { border-color: #30363d; }
    .agent-item.selected { border-color: #58a6ff; background: #161b22; }
    .agent-item .name { font-weight: 600; color: #58a6ff; font-size: 13px; }
    .agent-item .role { font-size: 10px; color: #8b949e; }
    .agent-item .meta { font-size: 10px; color: #484f58; margin-top: 2px; }
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tab-bar { display: flex; gap: 0; border-bottom: 1px solid #30363d; background: #161b22; flex-shrink: 0; }
    .tab { padding: 8px 16px; font-size: 12px; color: #8b949e; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab:hover { color: #c9d1d9; }
    .tab.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .content-body { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .event { padding: 5px 8px; margin: 1px 0; font-size: 12px; border-radius: 3px; border-left: 2px solid transparent; }
    .event:hover { background: #161b22; }
    .event .time { color: #484f58; margin-right: 6px; font-size: 11px; }
    .event .agent { color: #58a6ff; font-weight: 600; }
    .event .summary { color: #8b949e; }
    .event.created { border-left-color: #3fb950; }
    .event.destroyed { border-left-color: #484f58; }
    .event.message { border-left-color: #58a6ff; }
    .event.error { border-left-color: #f85149; }
    .msg { padding: 10px 12px; margin: 6px 0; border-radius: 6px; font-size: 12px; white-space: pre-wrap; word-break: break-word; max-height: 400px; overflow-y: auto; }
    .msg.user { background: #1c2128; border: 1px solid #30363d; }
    .msg.user::before { content: 'You'; display: block; font-weight: 600; color: #d2a8ff; font-size: 11px; margin-bottom: 4px; }
    .msg.assistant { background: #0d1117; border: 1px solid #1c2128; }
    .msg.assistant::before { content: attr(data-agent); display: block; font-weight: 600; color: #58a6ff; font-size: 11px; margin-bottom: 4px; }
    .msg .ts { font-size: 10px; color: #484f58; float: right; }
    .input-bar { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid #30363d; background: #161b22; flex-shrink: 0; }
    .input-bar input { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-family: inherit; font-size: 12px; }
    .input-bar input::placeholder { color: #484f58; }
    .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; font-size: 12px; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .btn:hover { background: #30363d; }
    .btn.primary { border-color: #58a6ff44; color: #58a6ff; }
    .btn.primary:hover { background: #58a6ff22; }
    .btn.danger { border-color: #f8514944; color: #f85149; font-size: 11px; }
    .btn.danger:hover { background: #f8514922; }
    .empty { color: #484f58; text-align: center; padding: 40px 16px; }
    .dispatch-row { display: flex; gap: 6px; padding: 6px; border-top: 1px solid #30363d; background: #1c2128; flex-shrink: 0; }
    .dispatch-row input { padding: 5px 8px; border-radius: 4px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-family: inherit; font-size: 11px; }
    .dispatch-row input:first-child { width: 80px; }
    .dispatch-row input:nth-child(2) { flex: 1; }
    .dispatch-row .btn { font-size: 11px; padding: 4px 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Squad Dashboard</h1>
    <div class="status">
      <span><span class="dot" id="statusDot"></span><span id="statusText"> Connecting...</span></span>
      <span>Agents: <strong id="sessionCount">0</strong></span>
      <span>Events: <strong id="eventCount">0</strong></span>
      <span style="color:#484f58" id="uptime"></span>
    </div>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">Agents</div>
      <div class="sidebar-body" id="agentList"><div class="empty">No active agents</div></div>
      <div class="dispatch-row">
        <input type="text" id="dAgent" placeholder="name">
        <input type="text" id="dMsg" placeholder="task..." onkeydown="if(event.key==='Enter')doDispatch()">
        <button class="btn primary" onclick="doDispatch()">Go</button>
      </div>
    </div>
    <div class="content">
      <div class="tab-bar">
        <div class="tab active" id="tabEvents" onclick="switchTab('events')">Events</div>
        <div class="tab" id="tabDetail" onclick="switchTab('detail')">Session Detail</div>
      </div>
      <div class="content-body" id="contentBody"><div class="empty">Select an agent to view session details</div></div>
      <div class="input-bar" id="sendBar" style="display:none">
        <input type="text" id="sendMsg" placeholder="Send follow-up message..." onkeydown="if(event.key==='Enter')doSend()">
        <button class="btn primary" onclick="doSend()">Send</button>
        <button class="btn danger" onclick="doClose(selectedAgent)">Close</button>
      </div>
    </div>
  </div>
  <script>
    let agents = [], events = [], seenKeys = new Set(), selectedAgent = null, currentTab = 'events', msgCache = {};
    const $ = id => document.getElementById(id);

    function fmtUp(s) { if (!s) return ''; if (s<60) return s+'s'; if (s<3600) return ~~(s/60)+'m'; return ~~(s/3600)+'h '+~~((s%3600)/60)+'m'; }
    function ago(ts) { if (!ts) return ''; const s=~~((Date.now()-new Date(ts).getTime())/1000); if (s<60) return s+'s'; if (s<3600) return ~~(s/60)+'m'; return ~~(s/3600)+'h'; }
    function roleColor(r) { if (!r) return '#8b949e'; r=r.toLowerCase(); if (/lead|orch/.test(r)) return '#d2a8ff'; if (/ui|front|react/.test(r)) return '#7ee787'; if (/core|back|api/.test(r)) return '#ffa657'; if (/test|qa|e2e/.test(r)) return '#79c0ff'; if (/review/.test(r)) return '#f778ba'; return '#8b949e'; }

    function renderAgents() {
      const el = $('agentList');
      $('sessionCount').textContent = agents.length;
      if (!agents.length) { el.innerHTML = '<div class="empty">No active agents</div>'; return; }
      el.innerHTML = agents.map(a => {
        const sel = a.agentName === selectedAgent ? ' selected' : '';
        const role = a.charterRole || 'agent';
        const mc = a.messageCount || 0;
        return `<div class="agent-item${sel}" onclick="selectAgent('${a.agentName}')">
          <div class="name">${a.agentName}</div>
          <div class="role" style="color:${roleColor(role)}">${role}</div>
          <div class="meta">${mc} msgs | ${ago(a.lastActiveAt)} ago</div>
        </div>`;
      }).join('');
    }

    function renderEvents() {
      const el = $('contentBody');
      $('eventCount').textContent = events.length;
      if (currentTab !== 'events') return;
      if (!events.length) { el.innerHTML = '<div class="empty">Waiting for events</div>'; return; }
      const atBot = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
      el.innerHTML = events.slice(-500).map(e => {
        const t = (e.type||'').toLowerCase();
        const cls = t.includes('created')?'created':t.includes('destroy')||t.includes('close')?'destroyed':t.includes('error')?'error':t.includes('message')?'message':'';
        const time = e.timestamp ? e.timestamp.slice(11,19) : '';
        const ag = e.agentName ? `<span class="agent">[${e.agentName}]</span> ` : '';
        return `<div class="event ${cls}"><span class="time">${time}</span>${ag}<span class="summary">${e.summary||e.type||''}</span></div>`;
      }).join('');
      if (atBot) el.scrollTop = el.scrollHeight;
    }

    function renderDetail() {
      const el = $('contentBody');
      if (currentTab !== 'detail') return;
      if (!selectedAgent) { el.innerHTML = '<div class="empty">Select an agent from the sidebar</div>'; return; }
      const msgs = msgCache[selectedAgent] || [];
      if (!msgs.length) { el.innerHTML = `<div class="empty">No messages yet for ${selectedAgent}</div>`; return; }
      const atBot = el.scrollTop + el.clientHeight >= el.scrollHeight - 40;
      el.innerHTML = msgs.map(m => {
        const ts = m.timestamp ? m.timestamp.slice(11,19) : '';
        const cls = m.role === 'user' ? 'user' : 'assistant';
        const content = (m.content||'').length > 2000 ? m.content.slice(0,2000)+'...' : m.content||'';
        return `<div class="msg ${cls}" data-agent="${selectedAgent}"><span class="ts">${ts}</span>${escHtml(content)}</div>`;
      }).join('');
      if (atBot) el.scrollTop = el.scrollHeight;
    }

    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function switchTab(tab) {
      currentTab = tab;
      $('tabEvents').className = 'tab' + (tab==='events'?' active':'');
      $('tabDetail').className = 'tab' + (tab==='detail'?' active':'');
      $('sendBar').style.display = tab==='detail' && selectedAgent ? '' : 'none';
      if (tab==='events') renderEvents(); else renderDetail();
    }

    async function selectAgent(name) {
      selectedAgent = name;
      $('dAgent').value = name;
      renderAgents();
      switchTab('detail');
      await fetchMessages(name);
    }

    async function fetchMessages(name) {
      try {
        const res = await fetch(`/api/sessions/${encodeURIComponent(name)}`);
        if (res.ok) { const d = await res.json(); msgCache[name] = d.messages || []; renderDetail(); }
      } catch {}
    }

    function setStatus(state, up) {
      $('statusDot').className = 'dot '+(state==='connected'?'green':state==='error'?'red':'yellow');
      $('statusText').textContent = state==='connected'?' Connected':state==='error'?' Disconnected':' Connecting...';
      if (up) $('uptime').textContent = 'up '+fmtUp(up);
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        if (res.ok) {
          const d = await res.json();
          setStatus(d.running||d.started?'connected':'error', d.uptime);
          if (d.agents) { agents = d.agents; renderAgents(); }
          if (d.recentEvents) {
            let added = false;
            for (const e of d.recentEvents) {
              const k = (e.timestamp||'')+(e.type||'')+(e.agentName||'');
              if (!seenKeys.has(k)) { seenKeys.add(k); events.push(e); added = true; }
            }
            if (added) renderEvents();
          }
        } else setStatus('error');
      } catch { setStatus('error'); }
      if (selectedAgent && currentTab === 'detail') fetchMessages(selectedAgent);
    }

    async function doDispatch() {
      const name = $('dAgent').value.trim(), msg = $('dMsg').value.trim();
      if (!name||!msg) return;
      try {
        const r = await fetch('/api/dispatch', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({agentName:name,message:msg}) });
        if (r.ok) { $('dMsg').value=''; setTimeout(pollStatus,500); selectAgent(name); }
        else { const d=await r.json(); alert('Failed: '+(d.error||'unknown')); }
      } catch(e) { alert('Failed: '+e.message); }
    }

    async function doSend() {
      if (!selectedAgent) return;
      const msg = $('sendMsg').value.trim();
      if (!msg) return;
      try {
        const r = await fetch('/api/send', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({agentName:selectedAgent,message:msg}) });
        if (r.ok) { $('sendMsg').value=''; setTimeout(()=>fetchMessages(selectedAgent),500); }
        else { const d=await r.json(); alert('Failed: '+(d.error||'unknown')); }
      } catch(e) { alert('Failed: '+e.message); }
    }

    async function doClose(name) {
      if (!name) return;
      try {
        await fetch('/api/close', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({agentName:name}) });
        selectedAgent = null; switchTab('events'); setTimeout(pollStatus,500);
      } catch {}
    }

    setInterval(pollStatus, 2000);
    pollStatus();
  </script>
</body>
</html>
